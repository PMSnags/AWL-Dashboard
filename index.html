<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open AWL Snags — Site Class & Criticality</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap');
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #21262d; --text: #e6edf3;
    --muted: #7d8590; --class-a: #58a6ff; --class-b: #d29922; --class-c: #6e7681;
    --critical-yes: #f85149; --critical-no: #3fb950; --header-bg: #1c2128;
    --row-hover: #1f2937; --accent: #388bfd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; min-height: 100vh; padding: 32px 24px; }
  .header { margin-bottom: 28px; }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); margin-bottom: 6px; }
  .header p { color: var(--muted); font-size: 13px; }
  .summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 20px; min-width: 130px; flex: 1; }
  .card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .card .value { font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 600; color: var(--text); }
  .card.red .value { color: var(--critical-yes); }
  .card.blue .value { color: var(--class-a); }
  .card.amber .value { color: var(--class-b); }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .filter-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .filter-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-right: 2px; }
  .btn { padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.15s ease; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); color: var(--text); }
  .btn.active { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
  .search-wrap { flex: 1; max-width: 280px; position: relative; }
  .search-wrap input { width: 100%; padding: 6px 12px 6px 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; outline: none; transition: border-color 0.15s; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
  .table-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
  table { width: 100%; border-collapse: collapse; }
  thead { background: var(--header-bg); }
  th { padding: 11px 14px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; white-space: nowrap; cursor: pointer; user-select: none; border-bottom: 1px solid var(--border); }
  th:hover { color: var(--text); }
  th .sort-arrow { margin-left: 5px; opacity: 0.4; font-size: 10px; }
  th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.1s; }
  tbody tr:hover { background: var(--row-hover); }
  tr.group-header td { background: #1a1f29; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 7px 14px; border-bottom: 1px solid var(--border); }
  tr.group-header:hover { background: #1a1f29; }
  .site-id { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12.5px; color: var(--text); }
  .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.3px; white-space: nowrap; }
  .badge-a { background: rgba(88,166,255,0.12); color: var(--class-a); border: 1px solid rgba(88,166,255,0.25); }
  .badge-b { background: rgba(210,153,34,0.12); color: var(--class-b); border: 1px solid rgba(210,153,34,0.25); }
  .badge-c { background: rgba(110,118,129,0.12); color: #a0aab5; border: 1px solid rgba(110,118,129,0.25); }
  .badge-crit { background: rgba(248,81,73,0.12); color: var(--critical-yes); border: 1px solid rgba(248,81,73,0.25); }
  .badge-ncrit { background: rgba(63,185,80,0.08); color: var(--critical-no); border: 1px solid rgba(63,185,80,0.2); }
  .badge-region { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px; background: rgba(56,139,253,0.1); color: #79c0ff; border: 1px solid rgba(56,139,253,0.2); }
  .badge-type { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); background: rgba(255,255,255,0.04); border: 1px solid var(--border); padding: 2px 7px; border-radius: 4px; }
  .issue-text { color: var(--muted); font-size: 12px; max-width: 320px; line-height: 1.4; display: block; }
  .issue-text.has-issue { color: #c9a227; }
  .date-text { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
  .no-results { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }
  .result-count { font-size: 12px; color: var(--muted); margin-left: auto; align-self: center; }
  .result-count span { color: var(--text); font-weight: 600; }
</style>
</head>

  <div class="result-count" id="resultCount"></div>
</div>
<div class="table-wrap">

        <th onclick="sortBy('Last Visit')">Last Visit <span class="sort-arrow">↕</span></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

let filters = { class: 'all', critical: 'all', region: 'all' };
let sortCol = null, sortDir = 1;

function setFilter(type, val, btn) {
  filters[type] = val;
  btn.closest('.filter-group').querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function sortBy(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
  document.querySelectorAll('th').forEach(th => th.classList.remove('sorted'));
  const cols = ['SITE ID','REGION','SITE CLASS','SITE TYPE','Critical','Issue if NOK'];
  if (HAS_LV) cols.push('Last Visit');
  const idx = cols.indexOf(col);
  if (idx >= 0) document.querySelectorAll('th')[idx].classList.add('sorted');
  renderTable();
}

function renderTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let filtered = data.filter(r => {
    if (filters.class !== 'all' && r['SITE CLASS'] !== filters.class) return false;
    if (filters.critical !== 'all' && r['Critical'] !== filters.critical) return false;
    if (filters.region !== 'all' && r['REGION'] !== filters.region) return false;
    if (search && !r['SITE ID'].toLowerCase().includes(search) && !(r['Issue if NOK']||'').toLowerCase().includes(search)) return false;
    return true;
  });
  if (sortCol) filtered.sort((a,b) => (a[sortCol]||'').localeCompare(b[sortCol]||'') * sortDir);
  document.getElementById('resultCount').innerHTML = `Showing <span>${filtered.length}</span> of <span>${TOTAL}</span>`;
  const tbody = document.getElementById('tableBody');
  if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="7" class="no-results">No results match your filters.</td></tr>'; return; }
  let html = '';
  if (!sortCol) {
    const groups = {};
    filtered.forEach(r => { const k = r['SITE CLASS']; if (!groups[k]) groups[k]=[]; groups[k].push(r); });
    ['Class A','Class B','Class C'].forEach(cls => {
      if (!groups[cls]) return;
      const rows = groups[cls], crit = rows.filter(r => r['Critical']==='Yes').length;
      html += `<tr class="group-header"><td colspan="7">${cls} &nbsp;·&nbsp; ${rows.length} sites &nbsp;·&nbsp; ${crit} critical</td></tr>`;
      rows.forEach(r => { html += buildRow(r); });
    });
  } else { filtered.forEach(r => { html += buildRow(r); }); }
  tbody.innerHTML = html;
}

function buildRow(r) {
  const ck = r['SITE CLASS'].replace('Class ','').toLowerCase();
  const iss = r['Issue if NOK'];
  const lvCell = HAS_LV ? `<td><span class="date-text">${r['Last Visit']}</span></td>` : '';
  return `<tr>
    <td><span class="site-id">${r['SITE ID']}</span></td>
    <td><span class="badge-region">${r['REGION']}</span></td>
    <td><span class="badge badge-${ck}">${r['SITE CLASS']}</span></td>
    <td><span class="badge-type">${r['SITE TYPE']}</span></td>
    <td>${r['Critical']==='Yes' ? '<span class="badge badge-crit">⚠ Critical</span>' : '<span class="badge badge-ncrit">Non-Critical</span>'}</td>
    <td>${(!iss||iss==='—') ? '<span class="issue-text">—</span>' : `<span class="issue-text has-issue">${iss}</span>`}</td>
    ${lvCell}
  </tr>`;
}
renderTable();
